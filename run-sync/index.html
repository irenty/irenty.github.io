<h1>run-sync</h1>
<p>run-sync is a personal, single-user tool. It reads the owner's own running
activities from Strava (read-only) and keeps a private, local copy so the owner
can analyse their own training over time.</p>
<p>It is not a public service and has no other users.</p>
